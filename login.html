<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashFlow. | Akses Masuk</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%2306b6d4'/><text x='50' y='72' font-size='65' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>C</text></svg>">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Konfigurasi Font Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen font-sans antialiased selection:bg-cyan-500/30 overflow-hidden flex">
    <!-- Elegant Page Loader -->
<div id="page-loader" class="fixed inset-0 z-[9999] bg-[#050505] flex items-center justify-center transition-opacity duration-500 opacity-100">
    <h1 class="text-3xl font-bold tracking-tight text-white animate-pulse">CashFlow<span class="text-cyan-500">.</span></h1>
</div>

    <!-- BAGIAN KIRI: Form Login/Register -->
    <div class="w-full lg:w-1/2 flex flex-col justify-center items-center p-8 lg:p-24 relative z-10">
        
        <!-- Logo -->
        <div class="absolute top-8 left-8 lg:top-12 lg:left-12 flex items-center gap-3">
            <h1 class="text-2xl font-bold tracking-tight text-white">CashFlow<span class="text-cyan-500">.</span></h1>
            <span class="bg-zinc-800 text-zinc-300 text-xs px-3 py-1 rounded-full border border-white/10 font-medium">Finance</span>
        </div>

        <!-- Wadah Form (Glassmorphism) -->
        <div class="w-full max-w-md bg-zinc-900/40 p-10 rounded-[2rem] border border-white/5 backdrop-blur-xl shadow-2xl relative">
            <!-- Glow effect di belakang form -->
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-cyan-500/10 blur-3xl rounded-full pointer-events-none"></div>

            <h2 id="form-title" class="text-3xl font-bold mb-2 tracking-tight text-white">Selamat Datang!</h2>
            <p id="form-subtitle" class="text-zinc-500 text-sm mb-8">Silakan masuk untuk melanjutkan ke dashboard.</p>
            
            <!-- Notifikasi Pesan -->
            <div id="error-msg" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 p-4 rounded-2xl mb-6 text-sm font-medium"></div>
            <div id="success-msg" class="hidden bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 p-4 rounded-2xl mb-6 text-sm font-medium"></div>

            <form id="auth-form" onsubmit="handleSubmit(event)" class="space-y-5">
                <div>
                    <label class="block text-zinc-500 text-xs font-semibold mb-2 uppercase tracking-wider">Username</label>
                    <input type="text" id="username" required placeholder="Masukkan username Anda" class="w-full bg-[#09090b] border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-zinc-200 focus:outline-none focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/50 transition-all placeholder:text-zinc-700">
                </div>
                <div>
                    <label class="block text-zinc-500 text-xs font-semibold mb-2 uppercase tracking-wider">Kata Sandi</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-[#09090b] border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-zinc-200 focus:outline-none focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/50 transition-all placeholder:text-zinc-700">
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-zinc-100 hover:bg-white text-zinc-900 font-bold py-4 rounded-2xl text-sm transition-all shadow-[0_0_20px_rgba(255,255,255,0.1)] hover:shadow-[0_0_25px_rgba(255,255,255,0.2)] mt-4">Masuk ke Akun</button>
            </form>

            <div class="mt-8 text-center text-sm border-t border-white/5 pt-6">
                <span id="toggle-text" class="text-zinc-500">Baru pertama kali?</span>
                <button onclick="toggleMode()" id="toggle-btn" class="text-cyan-400 hover:text-cyan-300 font-semibold ml-1 transition-colors">Buat Akun Gratis</button>
            </div>
        </div>
    </div>

    <!-- BAGIAN KANAN: Visual & Motivasi (Hanya muncul di Desktop) -->
    <div class="hidden lg:flex w-1/2 relative bg-zinc-900 border-l border-white/5 items-center justify-center p-24">
        <!-- Efek Latar Belakang -->
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(6,182,212,0.05)_0,transparent_70%)]"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-cyan-500/5 blur-[100px] rounded-full pointer-events-none"></div>
        <div class="absolute top-0 left-0 w-72 h-72 bg-blue-500/5 blur-[80px] rounded-full pointer-events-none"></div>

        <!-- Kartu Kutipan Finansial -->
        <div class="relative z-10 w-full max-w-lg bg-[#09090b]/80 backdrop-blur-md p-10 rounded-[2.5rem] border border-white/5">
            <div class="w-12 h-12 bg-zinc-800 rounded-full flex items-center justify-center border border-white/10 mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-cyan-500" fill="currentColor" viewBox="0 0 256 256"><path d="M116,72v88a48.05,48.05,0,0,1-48,48H52a12,12,0,0,1,0-24h16a24,24,0,0,0,24-24V104H68a12,12,0,0,1-12-12V72A12,12,0,0,1,68,60h36A12,12,0,0,1,116,72Zm84-12H164a12,12,0,0,0-12,12V92a12,12,0,0,0,12,12h24v56a24,24,0,0,1-24,24H148a12,12,0,0,0,0,24h16a48.05,48.05,0,0,0,48-48V72A12,12,0,0,0,200,60Z"></path></svg>
            </div>
            <p id="quote-text" class="text-2xl font-light leading-relaxed text-zinc-300 mb-6">"Kendalikan uangmu hari ini, atau uang itu yang akan mengendalikan masa depanmu."</p>
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-500 flex items-center justify-center text-white font-bold text-sm">
                    AI
                </div>
                <div>
                    <p id="quote-author" class="font-medium text-white">Financial Companion</p>
                    <p class="text-xs text-zinc-500">Smart Insights</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data Kutipan Acak untuk mengisi bagian layar kanan
        const quotes = [
            { text: "Jangan menabung apa yang tersisa setelah pengeluaran, tetapi keluarkan apa yang tersisa setelah menabung.", author: "Warren Buffett" },
            { text: "Celengan kecil hari ini adalah benteng pertahanan finansialmu di masa depan.", author: "Financial Wisdom" },
            { text: "Investasi terbaik adalah investasi pada ketenangan pikiran bebas utang.", author: "AI Companion" },
            { text: "Masa depan yang cerah dibangun dari keputusan finansial yang bijak hari ini.", author: "Smart Insights" },
            { text: "Menabung bukan soal seberapa besar penghasilanmu, tapi seberapa konsisten kedisiplinanmu.", author: "Money Management" }
        ];

        const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quote-text').innerText = `"${randomQuote.text}"`;
        document.getElementById('quote-author').innerText = randomQuote.author;

        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('form-title').innerText = isLogin ? 'Selamat Datang!' : 'Buat Akun Baru';
            document.getElementById('form-subtitle').innerText = isLogin ? 'Silakan masuk untuk melanjutkan ke dashboard.' : 'Mulai kelola keuanganmu dengan lebih baik.';
            document.getElementById('submit-btn').innerText = isLogin ? 'Masuk ke Akun' : 'Daftar Sekarang';
            document.getElementById('toggle-text').innerText = isLogin ? 'Baru pertama kali?' : 'Sudah punya akun?';
            document.getElementById('toggle-btn').innerText = isLogin ? 'Buat Akun Gratis' : 'Masuk di sini';
            document.getElementById('error-msg').classList.add('hidden');
            document.getElementById('success-msg').classList.add('hidden');
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const endpoint = isLogin ? '/api/login' : '/api/register';

            const errDiv = document.getElementById('error-msg');
            const succDiv = document.getElementById('success-msg');
            errDiv.classList.add('hidden');
            succDiv.classList.add('hidden');

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    if (isLogin) {
                        const data = await response.json();
                        // SIMPAN TOKEN JWT DAN USERNAME KE BROWSER
                        localStorage.setItem('cashflow_token', data.token);
                        localStorage.setItem('cashflow_username', username);
                        window.location.href = '/dashboard';
                    } else {
                        succDiv.innerText = 'Registrasi berhasil! Silakan login untuk memulai.';
                        succDiv.classList.remove('hidden');
                        document.getElementById('auth-form').reset();
                        toggleMode();
                    }
                } else {
                    const errText = await response.text();
                    errDiv.innerText = errText || 'Terjadi kesalahan pada sistem.';
                    errDiv.classList.remove('hidden');
                }
            } catch (err) {
                errDiv.innerText = 'Gagal terhubung ke server. Periksa koneksi internet Anda.';
                errDiv.classList.remove('hidden');
            }
        }
    </script>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const loader = document.getElementById("page-loader");
        
        // 1. Efek Fade-Out saat halaman selesai dimuat
        setTimeout(() => {
            loader.classList.remove("opacity-100");
            loader.classList.add("opacity-0");
            
            // Hilangkan elemen setelah transisi selesai (500ms)
            setTimeout(() => {
                loader.style.display = "none";
            }, 500);
        }, 300); // Sedikit jeda agar logo terlihat elegan sebelum hilang

        // 2. Efek Fade-In saat tombol/link diklik untuk pindah halaman
        document.querySelectorAll("a").forEach(link => {
            link.addEventListener("click", function(e) {
                const href = this.getAttribute("href");
                
                // Cek apakah link valid dan bukan link anchor (seperti #services)
                if (href && !href.startsWith("#") && this.target !== "_blank") {
                    e.preventDefault(); // Cegah pindah halaman secara instan
                    
                    loader.style.display = "flex";
                    // Sedikit trik agar CSS transition berjalan mulus
                    setTimeout(() => {
                        loader.classList.remove("opacity-0");
                        loader.classList.add("opacity-100");
                    }, 10);

                    // Pindah ke halaman baru setelah layar kembali gelap (500ms)
                    setTimeout(() => {
                        window.location.href = href;
                    }, 500);
                }
            });
        });
    });
</script>
</body>
</html>
