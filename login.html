<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Website Cashflow</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-96 border border-slate-700">
        <h2 id="form-title" class="text-2xl font-bold mb-6 text-center text-cyan-400">Login Cashflow</h2>
        
        <div id="error-msg" class="hidden bg-red-500/20 border border-red-500 text-red-300 p-3 rounded-lg mb-4 text-sm"></div>
        <div id="success-msg" class="hidden bg-green-500/20 border border-green-500 text-green-300 p-3 rounded-lg mb-4 text-sm"></div>

        <form id="auth-form" onsubmit="handleSubmit(event)">
            <div class="mb-4">
                <label class="block text-slate-400 text-sm mb-2">Username</label>
                <input type="text" id="username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-cyan-400 text-white">
            </div>
            <div class="mb-6">
                <label class="block text-slate-400 text-sm mb-2">Password</label>
                <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-cyan-400 text-white">
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold py-2 rounded-lg transition">Masuk</button>
        </form>

        <div class="mt-6 text-center text-sm">
            <span id="toggle-text" class="text-slate-400">Belum punya akun?</span>
            <button onclick="toggleMode()" id="toggle-btn" class="text-cyan-400 hover:underline ml-1 font-semibold">Daftar</button>
        </div>
    </div>

    <script>
        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('form-title').innerText = isLogin ? 'Login Cashflow' : 'Daftar Akun Baru';
            document.getElementById('submit-btn').innerText = isLogin ? 'Masuk' : 'Daftar';
            document.getElementById('toggle-text').innerText = isLogin ? 'Belum punya akun?' : 'Sudah punya akun?';
            document.getElementById('toggle-btn').innerText = isLogin ? 'Daftar' : 'Login';
            document.getElementById('error-msg').classList.add('hidden');
            document.getElementById('success-msg').classList.add('hidden');
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const endpoint = isLogin ? '/api/login' : '/api/register';

            const errDiv = document.getElementById('error-msg');
            const succDiv = document.getElementById('success-msg');
            errDiv.classList.add('hidden');
            succDiv.classList.add('hidden');

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    if (isLogin) {
                        // Simpan username ke browser sebelum masuk ke dashboard
                        localStorage.setItem('cashflow_username', username);
                        window.location.href = '/dashboard';
                    } else {
                        succDiv.innerText = 'Registrasi berhasil! Silakan login.';
                        succDiv.classList.remove('hidden');
                        toggleMode();
                    }
                } else {
                    const errText = await response.text();
                    errDiv.innerText = errText || 'Terjadi kesalahan.';
                    errDiv.classList.remove('hidden');
                }
            } catch (err) {
                errDiv.innerText = 'Gagal terhubung ke server.';
                errDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
